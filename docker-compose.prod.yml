# Kios — compose untuk PRODUCTION.
# Cara pakai: salin .env.example → .env, isi nilainya, lalu:
#   docker compose -f docker-compose.prod.yml up -d
# Semua nilai rahasia diambil dari file .env di folder ini (lihat .env.example).

# Nama proyek terpisah agar tidak menimpa container compose dev (yang bernama "kios")
name: kios-prod

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi di .env}
      MYSQL_DATABASE: kios
      MYSQL_USER: kios
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?isi di .env}
    volumes:
      - db_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ukios", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_DSN: "kios:${MYSQL_PASSWORD}@tcp(db:3306)/kios?parseTime=true&multiStatements=true"
      JWT_SECRET: ${JWT_SECRET:?isi di .env (openssl rand -hex 32)}
      APP_TZ: ${APP_TZ:-Asia/Makassar}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:?isi di .env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:80}
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db_data_prod:
