# Template nginx dengan variabel yang di-substitusi saat container start
# (mekanisme /etc/nginx/templates dari image resmi nginx).
#
#   API_ORIGIN  — tujuan proxy API.
#       Tidak diset (default Dockerfile) → http://api:8080 (docker-compose.prod)
#       Platform cloud (kotacloud dkk.)  → https://domain-api-anda
#
#   NGINX_LOCAL_RESOLVERS — diisi otomatis oleh image nginx resmi (dari
#       /etc/resolv.conf) saat NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Aset frontend di-cache lama (nama file ber-hash dari Vite)
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API dan healthcheck diteruskan ke server Go.
  # Pakai variabel upstream + resolver: nginx tetap hidup walau API belum siap/restart.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
  set $api_upstream ${API_ORIGIN};

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;
  }

  location = /healthz {
    proxy_pass $api_upstream;
  }

  # SPA (hash routing): semua IP selain aset & API → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
