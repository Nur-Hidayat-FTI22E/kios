server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Aset frontend di-cache lama (nama file ber-hash dari Vite)
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API dan healthcheck diteruskan ke server Go.
  # resolver Docker DNS + variabel upstream: nginx tetap hidup walau api sempat restart.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;
  }

  location = /healthz {
    proxy_pass $api_upstream;
  }

  # SPA (hash routing): semua IP selain aset & API → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
